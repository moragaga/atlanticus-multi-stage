[project]
name = "atlanticus-web-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web-reference==0.1.0",
]

[dependency-groups]
dev = [
    "atlanticus-web-users-cosmos==0.1.0",
    "atlanticus-web-manager==0.1.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
atlanticus-web-reference = { workspace = true }
atlanticus-web = { workspace = true }
atlanticus-web-observability = { workspace = true }
atlanticus-web-identity = { workspace = true }
atlanticus-web-identity-local = { workspace = true }
atlanticus-web-identity-app-service = { workspace = true }
atlanticus-web-users = { workspace = true }
atlanticus-web-users-local = { workspace = true }
atlanticus-web-users-cosmos = { workspace = true }
atlanticus-web-navigation = { workspace = true }
atlanticus-web-manager = { workspace = true }

[tool.uv.workspace]
members = [
    "framework/core",
    "framework/observability",
    "capabilities/navigation",
    "capabilities/manager",
    "capabilities/identity/core",
    "capabilities/identity/local",
    "capabilities/identity/app-service",
    "capabilities/users/core",
    "capabilities/users/local",
    "capabilities/users/cosmos",
    "applications/reference",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus", "atlanticus_web_reference"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "framework/core/tests",
    "framework/observability/tests",
    "capabilities/navigation/tests",
    "capabilities/manager/tests",
    "capabilities/identity/core/tests",
    "capabilities/identity/local/tests",
    "capabilities/identity/app-service/tests",
    "capabilities/users/core/tests",
    "capabilities/users/local/tests",
    "capabilities/users/cosmos/tests",
    "applications/reference/tests",
]
addopts = "-q --import-mode=importlib"
