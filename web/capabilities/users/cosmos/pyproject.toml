[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-users-cosmos"
version = "0.1.0"
description = "Fuente Cosmos DB de usuarios para aplicaciones web Atlanticus"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-users-configuration==0.1.0",
]

[tool.uv.sources]
atlanticus-web-users = { workspace = true }
atlanticus-web-users-configuration = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.users.cosmos*"]

[tool.setuptools.package-data]
"atlanticus.web.users.cosmos" = ["py.typed"]
