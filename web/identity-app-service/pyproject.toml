[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-identity-app-service"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web-identity==0.1.0",
    "flask==3.1.3",
]

[tool.uv.sources]
atlanticus-web-identity = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.web.identity.app_service*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.web.identity.app_service" = ["py.typed"]
