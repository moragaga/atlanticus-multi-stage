[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-composition-runtime-infrastructure"
version = "0.1.0"
description = "Composición de infraestructura runtime para aplicaciones Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-configuration==0.1.0",
    "atlanticus-cosmos==0.1.0",
    "atlanticus-http==0.1.0",
    "atlanticus-web-composition-sharepoint-http==0.1.0",
]

[tool.uv.sources]
atlanticus-kernel = { path = "../../../backend/kernel", editable = true }
atlanticus-observability = { path = "../../../backend/observability", editable = true }
atlanticus-configuration = { path = "../../../backend/configuration", editable = true }
atlanticus-cosmos = { path = "../../../connectivity/cosmos", editable = true }
atlanticus-http = { path = "../../../connectivity/http-client", editable = true }
atlanticus-web-composition-sharepoint-http = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.compositions.runtime_infrastructure*"]

[tool.setuptools.package-data]
"atlanticus.web.compositions.runtime_infrastructure" = ["py.typed"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
