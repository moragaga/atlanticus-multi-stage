[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-composition-navigation-activity"
version = "0.1.0"
description = "Composición opcional entre Navigation y User Activity"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-users-activity==0.1.0",
]

[tool.uv.sources]
atlanticus-web = { workspace = true }
atlanticus-web-navigation = { workspace = true }
atlanticus-web-users-activity = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.compositions.navigation_activity*"]
