[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-composition-users-navigation"
version = "0.1.0"
description = "Composición opcional entre Users y Navigation para Atlanticus Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-users==0.1.0",
]

[tool.uv.sources]
atlanticus-web-identity = { workspace = true }
atlanticus-web-navigation = { workspace = true }
atlanticus-web-users = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.compositions.users_navigation*"]
