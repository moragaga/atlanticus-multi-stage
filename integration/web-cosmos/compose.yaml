name: atlanticus-web-cosmos-integration

services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    hostname: cosmos-emulator
    environment:
      PROTOCOL: "http"
      GATEWAY_PUBLIC_ENDPOINT: "cosmos-emulator"
      ENABLE_EXPLORER: "true"
      ENABLE_TELEMETRY: "false"
      LOG_LEVEL: "warn"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "1234:1234"
    restart: "no"
    mem_limit: 2g
    cpus: 1.00

  web-cosmos-integration:
    image: atlanticus-web-cosmos-integration:local
    build:
      context: ../..
      dockerfile: integration/web-cosmos/Dockerfile
    init: true
    depends_on:
      - cosmos-emulator
    environment:
      ATLANTICUS_RUN_WEB_COSMOS_INTEGRATION: "1"
      ATLANTICUS_COSMOS_READY_URL: "http://cosmos-emulator:8080/ready"
      ATLANTICUS_COSMOS_ENDPOINT: "http://cosmos-emulator:8081"
      ATLANTICUS_COSMOS_KEY: "${ATLANTICUS_COSMOS_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}"
      ATLANTICUS_AZURE_OBSERVABILITY_MODE: "off"
    restart: "no"
    mem_limit: 512m
    cpus: 0.50
