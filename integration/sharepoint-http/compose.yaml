name: atlanticus-sharepoint-http-integration

services:
  sharepoint-http-integration:
    image: atlanticus-sharepoint-http-integration:local
    build:
      context: ../..
      dockerfile: integration/sharepoint-http/Dockerfile
    init: true
    environment:
      - ATLANTICUS_SHAREPOINT_READ_ENDPOINT
      - ATLANTICUS_SHAREPOINT_WRITE_ENDPOINT
      - ATLANTICUS_SHAREPOINT_ROOT_PATH
      - ATLANTICUS_SHAREPOINT_TOOL_PATH
      - ATLANTICUS_AZURE_OBSERVABILITY_MODE=off
    restart: "no"
    mem_limit: 512m
    cpus: 0.50
