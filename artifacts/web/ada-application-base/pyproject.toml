[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-application-base-artifact"
version = "0.1.0"
description = "Aplicación base deployable de ADA sobre Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-composition-web-deployment==0.1.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-identity-app-service==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "dash==4.4.1",
    "gunicorn==26.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-application-base = "ada_application_base.__main__:main"
ada-application-base-prepare = "ada_application_base.prepare:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada_application_base*"]

[tool.setuptools.package-data]
"ada_application_base" = ["py.typed"]

[tool.uv]
find-links = ["wheels"]

[tool.uv.sources]
ada-composition-web-deployment = { path = "wheels/ada_composition_web_deployment-0.1.0-py3-none-any.whl" }
atlanticus-web = { path = "wheels/atlanticus_web-0.1.0-py3-none-any.whl" }
atlanticus-web-identity-app-service = { path = "wheels/atlanticus_web_identity_app_service-0.1.0-py3-none-any.whl" }
atlanticus-web-identity-local = { path = "wheels/atlanticus_web_identity_local-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented", "wheels"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus", "ada_application_base"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
