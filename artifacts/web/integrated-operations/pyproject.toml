[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-integrated-operations-artifact"
version = "0.1.6"
description = "Aplicación deployable de Operaciones Integradas de ADA sobre Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-composition-configuration-manager==0.1.21",
    "ada-composition-integrated-operations==0.1.0",
    "ada-composition-manager-surface==0.1.1",
    "ada-composition-surface==0.1.0",
    "ada-composition-web-application==0.1.0",
    "ada-composition-web-bootstrap==0.1.10",
    "ada-composition-web-deployment==0.1.12",
    "ada-configuration-kpis==0.2.3",
    "ada-configuration-tools==0.1.8",
    "ada-contracts-tool-manifest==0.1.0",
    "ada-feature-alarms==0.1.0",
    "ada-feature-dashboard==0.1.0",
    "ada-runtime-web==0.1.0",
    "ada-ui-component-branding==0.1.0",
    "ada-ui-component-global-indicator==0.1.0",
    "ada-ui-component-state-wrapper==0.1.0",
    "ada-ui-framework-core==0.1.0",
    "ada-ui-shell-header==0.1.0",
    "ada-ui-shell-navigation==0.1.0",
    "ada-ui-shell-time-status==0.1.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-composition-runtime-infrastructure==0.1.1",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "atlanticus-web-manager==0.3.11",
    "atlanticus-web-users-cosmos==0.1.6",
    "atlanticus-web-users-local==0.1.0",
    "dash==4.4.1",
    "gunicorn==26.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-integrated-operations = "integrated_operations.__main__:main"
ada-integrated-operations-prepare = "integrated_operations.deployment.prepare:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["integrated_operations*"]

[tool.setuptools.package-data]
"integrated_operations" = [
    "py.typed",
    "resources/css/*.css",
    "resources/js/*.js",
]

[tool.uv]
find-links = ["wheels"]

[tool.uv.sources]
ada-composition-configuration-manager = { path = "wheels/ada_composition_configuration_manager-0.1.21-py3-none-any.whl" }
ada-composition-integrated-operations = { path = "wheels/ada_composition_integrated_operations-0.1.0-py3-none-any.whl" }
ada-composition-manager-surface = { path = "wheels/ada_composition_manager_surface-0.1.1-py3-none-any.whl" }
ada-composition-surface = { path = "wheels/ada_composition_surface-0.1.0-py3-none-any.whl" }
ada-composition-web-application = { path = "wheels/ada_composition_web_application-0.1.0-py3-none-any.whl" }
ada-composition-web-bootstrap = { path = "wheels/ada_composition_web_bootstrap-0.1.10-py3-none-any.whl" }
ada-composition-web-deployment = { path = "wheels/ada_composition_web_deployment-0.1.12-py3-none-any.whl" }
ada-configuration-kpis = { path = "wheels/ada_configuration_kpis-0.2.3-py3-none-any.whl" }
ada-configuration-tools = { path = "wheels/ada_configuration_tools-0.1.8-py3-none-any.whl" }
ada-contracts-tool-manifest = { path = "wheels/ada_contracts_tool_manifest-0.1.0-py3-none-any.whl" }
ada-feature-alarms = { path = "wheels/ada_feature_alarms-0.1.0-py3-none-any.whl" }
ada-feature-dashboard = { path = "wheels/ada_feature_dashboard-0.1.0-py3-none-any.whl" }
ada-runtime-web = { path = "wheels/ada_runtime_web-0.1.0-py3-none-any.whl" }
ada-ui-component-branding = { path = "wheels/ada_ui_component_branding-0.1.0-py3-none-any.whl" }
ada-ui-component-global-indicator = { path = "wheels/ada_ui_component_global_indicator-0.1.0-py3-none-any.whl" }
ada-ui-component-state-wrapper = { path = "wheels/ada_ui_component_state_wrapper-0.1.0-py3-none-any.whl" }
ada-ui-framework-core = { path = "wheels/ada_ui_framework_core-0.1.0-py3-none-any.whl" }
ada-ui-shell-header = { path = "wheels/ada_ui_shell_header-0.1.0-py3-none-any.whl" }
ada-ui-shell-navigation = { path = "wheels/ada_ui_shell_navigation-0.1.0-py3-none-any.whl" }
ada-ui-shell-time-status = { path = "wheels/ada_ui_shell_time_status-0.1.0-py3-none-any.whl" }
atlanticus-web = { path = "wheels/atlanticus_web-0.1.0-py3-none-any.whl" }
atlanticus-web-composition-runtime-infrastructure = { path = "wheels/atlanticus_web_composition_runtime_infrastructure-0.1.1-py3-none-any.whl" }
atlanticus-web-identity = { path = "wheels/atlanticus_web_identity-0.1.0-py3-none-any.whl" }
atlanticus-web-identity-local = { path = "wheels/atlanticus_web_identity_local-0.1.0-py3-none-any.whl" }
atlanticus-web-manager = { path = "wheels/atlanticus_web_manager-0.3.11-py3-none-any.whl" }
atlanticus-web-users-cosmos = { path = "wheels/atlanticus_web_users_cosmos-0.1.6-py3-none-any.whl" }
atlanticus-web-users-local = { path = "wheels/atlanticus_web_users_local-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented", "wheels"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus", "integrated_operations"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"