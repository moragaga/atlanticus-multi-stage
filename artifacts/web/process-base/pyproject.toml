[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-process-base-artifact"
version = "0.1.0"
description = "Artifact portable de certificación para la composición Process de ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-composition-process==0.1.0",
    "ada-contracts-tool-manifest==0.1.0",
    "ada-feature-alarms==0.1.0",
    "ada-feature-dashboard==0.1.0",
    "ada-runtime-web==0.1.0",
    "ada-ui-component-branding==0.1.0",
    "ada-ui-component-global-indicator==0.1.0",
    "ada-ui-shell-header==0.1.0",
    "ada-ui-shell-time-status==0.1.0",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
    "gunicorn==26.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-process-base = "process_base.__main__:main"

[tool.uv.sources]
ada-composition-process = { path = "../../../scopes/ada/compositions/process", editable = true }
ada-contracts-tool-manifest = { path = "../../../scopes/ada/contracts/tool-manifest", editable = true }
ada-feature-alarms = { path = "../../../scopes/ada/features/alarms", editable = true }
ada-feature-dashboard = { path = "../../../scopes/ada/features/dashboard", editable = true }
ada-runtime-web = { path = "../../../scopes/ada/runtime/web", editable = true }
ada-ui-framework-core = { path = "../../../scopes/ada/ui/framework/core", editable = true }
ada-ui-layout-process = { path = "../../../scopes/ada/ui/layouts/process", editable = true }
ada-ui-component-branding = { path = "../../../scopes/ada/ui/components/branding", editable = true }
ada-ui-component-component-card = { path = "../../../scopes/ada/ui/components/component-card", editable = true }
ada-ui-component-component-container = { path = "../../../scopes/ada/ui/components/component-container", editable = true }
ada-ui-component-global-indicator = { path = "../../../scopes/ada/ui/components/global-indicator", editable = true }
ada-ui-component-state-wrapper = { path = "../../../scopes/ada/ui/components/state-wrapper", editable = true }
ada-ui-shell-header = { path = "../../../scopes/ada/ui/shell/header", editable = true }
ada-ui-shell-time-status = { path = "../../../scopes/ada/ui/shell/time-status", editable = true }
atlanticus-web = { path = "../../../web/framework/core", editable = true }
atlanticus-web-observability = { path = "../../../web/framework/observability", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["process_base*"]

[tool.setuptools.package-data]
"process_base" = [
    "resources/css/*.css",
    "resources/css/css.list",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus", "process_base"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
