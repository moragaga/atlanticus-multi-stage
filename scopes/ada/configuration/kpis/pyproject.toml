[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-configuration-kpis"
version = "0.1.0"
description = "Configuración revisionada de bindings KPI hacia destinos proyectados ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-configuration-tools==0.1.5",
    "ada-contracts-tool-manifest==0.1.0",
]

[tool.uv.sources]
ada-configuration-tools = { workspace = true }
ada-contracts-tool-manifest = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.configuration.kpis*"]

[tool.setuptools.package-data]
"ada.configuration.kpis" = ["py.typed"]
