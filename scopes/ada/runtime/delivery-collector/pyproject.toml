[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-runtime-delivery-collector"
version = "0.1.1"
description = "Protected Dash collector for ADA runtime Latest and Timeseries deliveries"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-runtime-component-stores==0.1.0",
    "ada-runtime-delivery-cache==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-runtime-component-stores = { workspace = true }
ada-runtime-delivery-cache = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.runtime.delivery_collector*"]

[tool.setuptools.package-data]
"ada.runtime.delivery_collector" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
