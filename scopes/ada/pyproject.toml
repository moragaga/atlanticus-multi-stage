[project]
name = "ada-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-application-reference==0.1.0",
    "ada-composition-web-application==0.1.0",
    "ada-composition-web-bootstrap==0.1.16",
    "ada-composition-web-deployment==0.1.18",
    "ada-application-configuration-manager==0.2.27",
    "ada-composition-configuration-manager==0.1.27",
    "ada-composition-process==0.1.0",
    "ada-composition-integrated-operations==0.1.0",
    "ada-configuration-kpis==0.2.9",
    "ada-runtime-delivery-cache==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
ada-composition-web-application = { workspace = true }
ada-composition-web-bootstrap = { workspace = true }
ada-composition-web-deployment = { workspace = true }
ada-composition-integrated-operations = { workspace = true }
ada-composition-process = { workspace = true }
ada-application-reference = { workspace = true }
ada-application-configuration-manager = { workspace = true }
ada-composition-configuration-manager = { workspace = true }
ada-configuration-tools = { workspace = true }
ada-configuration-kpis = { workspace = true }
ada-contracts-tool-manifest = { workspace = true }
ada-runtime-web = { workspace = true }
ada-feature-alarms = { workspace = true }
ada-feature-dashboard = { workspace = true }
ada-ui-framework-core = { workspace = true }
ada-ui-layout-integrated-operations = { workspace = true }
ada-ui-layout-process = { workspace = true }
ada-ui-component-branding = { workspace = true }
ada-ui-component-component-card = { workspace = true }
ada-ui-component-component-container = { workspace = true }
ada-ui-component-global-indicator = { workspace = true }
ada-ui-component-state-wrapper = { workspace = true }
ada-ui-shell-header = { workspace = true }
ada-ui-shell-navigation = { workspace = true }
ada-ui-shell-time-status = { workspace = true }
atlanticus-web = { path = "../../web/framework/core", editable = true }
atlanticus-web-manager = { path = "../../web/capabilities/manager", editable = true }
atlanticus-web-observability = { path = "../../web/framework/observability", editable = true }
atlanticus-web-navigation = { path = "../../web/capabilities/navigation/core", editable = true }
atlanticus-web-composition-navigation-activity = { path = "../../web/compositions/navigation-activity", editable = true }
atlanticus-web-composition-users-navigation = { path = "../../web/compositions/users-navigation", editable = true }
atlanticus-web-identity = { path = "../../web/capabilities/identity/core", editable = true }
atlanticus-web-identity-app-service = { path = "../../web/capabilities/identity/app-service", editable = true }
atlanticus-web-identity-local = { path = "../../web/capabilities/identity/local", editable = true }
atlanticus-web-users = { path = "../../web/capabilities/users/core", editable = true }
atlanticus-web-users-activity = { path = "../../web/capabilities/users/activity", editable = true }
atlanticus-web-users-local = { path = "../../web/capabilities/users/local", editable = true }
atlanticus-web-users-configuration = { path = "../../web/capabilities/users/configuration", editable = true }
atlanticus-web-composition-runtime-infrastructure = { path = "../../web/compositions/runtime-infrastructure", editable = true }
atlanticus-web-composition-sharepoint-http = { path = "../../web/compositions/sharepoint-http", editable = true }
atlanticus-web-users-cosmos = { path = "../../web/capabilities/users/cosmos", editable = true }
atlanticus-web-navigation-configuration = { path = "../../web/capabilities/navigation/configuration", editable = true }
atlanticus-kernel = { path = "../../backend/kernel", editable = true }
atlanticus-observability = { path = "../../backend/observability", editable = true }
atlanticus-cosmos = { path = "../../connectivity/cosmos", editable = true }
atlanticus-http = { path = "../../connectivity/http-client", editable = true }

ada-runtime-delivery-cache = { workspace = true }
[tool.uv.workspace]
members = [
    "contracts/tool-manifest",
    "configuration/tools",
    "configuration/kpis",
    "runtime/web",
    "runtime/delivery-cache",
    "compositions/web-application",
    "compositions/web-bootstrap",
    "compositions/web-deployment",
    "compositions/configuration-manager",
    "compositions/process",
    "compositions/integrated-operations",
    "ui/framework/core",
    "ui/layouts/integrated-operations",
    "ui/layouts/process",
    "features/alarms",
    "features/dashboard",
    "ui/components/branding",
    "ui/components/component-card",
    "ui/components/component-container",
    "ui/components/global-indicator",
    "ui/components/state-wrapper",
    "ui/shell/header",
    "ui/shell/navigation",
    "ui/shell/time-status",
    "applications/reference",
    "applications/configuration-manager",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
    "**/resources/css/00-bootstrap.min.css",
    "**/resources/js/00_bootstrap.bundle.min.js",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "contracts/tool-manifest/tests",
    "configuration/tools/tests",
    "configuration/kpis/tests",
    "runtime/web/tests",
    "compositions/web-application/tests",
    "compositions/web-bootstrap/tests",
    "compositions/web-deployment/tests",
    "compositions/configuration-manager/tests",
    "compositions/process/tests",
    "compositions/integrated-operations/tests",
    "ui/framework/core/tests",
    "ui/layouts/integrated-operations/tests",
    "ui/layouts/process/tests",
    "features/alarms/tests",
    "features/dashboard/tests",
    "ui/components/branding/tests",
    "ui/components/component-card/tests",
    "ui/components/component-container/tests",
    "ui/components/global-indicator/tests",
    "ui/components/state-wrapper/tests",
    "ui/shell/header/tests",
    "ui/shell/navigation/tests",
    "ui/shell/time-status/tests",
    "applications/reference/tests",
    "applications/configuration-manager/tests",
]
addopts = "-q --import-mode=importlib"
