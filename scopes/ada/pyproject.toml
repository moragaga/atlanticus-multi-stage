[project]
name = "ada-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-application-reference==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
ada-application-reference = { workspace = true }
ada-contracts-tool-manifest = { workspace = true }
ada-runtime-web = { workspace = true }
ada-ui-framework-core = { workspace = true }
ada-ui-component-branding = { workspace = true }
ada-ui-component-global-indicator = { workspace = true }
ada-ui-component-state-wrapper = { workspace = true }
ada-ui-shell-header = { workspace = true }
ada-ui-shell-navigation = { workspace = true }
atlanticus-web = { path = "../../web/framework/core", editable = true }
atlanticus-web-observability = { path = "../../web/framework/observability", editable = true }
atlanticus-web-navigation = { path = "../../web/capabilities/navigation", editable = true }
atlanticus-web-identity = { path = "../../web/capabilities/identity/core", editable = true }
atlanticus-web-identity-local = { path = "../../web/capabilities/identity/local", editable = true }
atlanticus-web-users = { path = "../../web/capabilities/users/core", editable = true }
atlanticus-web-users-local = { path = "../../web/capabilities/users/local", editable = true }

[tool.uv.workspace]
members = [
    "contracts/tool-manifest",
    "runtime/web",
    "ui/framework/core",
    "ui/components/branding",
    "ui/components/global-indicator",
    "ui/components/state-wrapper",
    "ui/shell/header",
    "ui/shell/navigation",
    "applications/reference",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
    "**/resources/css/00-bootstrap.min.css",
    "**/resources/js/00_bootstrap.bundle.min.js",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "contracts/tool-manifest/tests",
    "runtime/web/tests",
    "ui/framework/core/tests",
    "ui/components/branding/tests",
    "ui/components/global-indicator/tests",
    "ui/components/state-wrapper/tests",
    "ui/shell/header/tests",
    "ui/shell/navigation/tests",
    "applications/reference/tests",
]
addopts = "-q --import-mode=importlib"
