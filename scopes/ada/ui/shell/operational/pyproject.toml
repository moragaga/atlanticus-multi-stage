[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-ui-shell-operational"
version = "0.1.1"
description = "Cascarón operacional genérico reutilizable para superficies ADA"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-contracts-tool-manifest==0.1.0",
    "ada-feature-alarms==0.1.0",
    "ada-ui-component-state-wrapper==0.1.0",
    "ada-ui-framework-core==0.1.0",
    "ada-ui-shell-header==0.1.1",
    "ada-ui-shell-time-status==0.1.0",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-contracts-tool-manifest = { workspace = true }
ada-feature-alarms = { workspace = true }
ada-ui-component-state-wrapper = { workspace = true }
ada-ui-framework-core = { workspace = true }
ada-ui-shell-header = { workspace = true }
ada-ui-shell-time-status = { workspace = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.ui.shell.operational*"]

[tool.setuptools.package-data]
"ada.ui.shell.operational" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
