[project]
name = "ada-ui-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-ui-reference==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
ada-ui-reference = { workspace = true }
ada-ui-core = { workspace = true }
ada-ui-navigation = { workspace = true }
atlanticus-web = { path = "../../../web/atlanticus-web", editable = true }
atlanticus-web-observability = { path = "../../../web/observability", editable = true }
atlanticus-web-navigation = { path = "../../../web/navigation", editable = true }

[tool.uv.workspace]
members = [
    "core",
    "navigation",
    "reference-app",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
    "**/resources/css/00_bootstrap.min.css",
    "**/resources/js/00_bootstrap.bundle.min.js",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "ada_ui_reference", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
    "navigation/tests",
    "reference-app/tests",
]
addopts = "-q --import-mode=importlib"
