[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-ui-header"
version = "0.1.0"
description = "Header operacional reutilizable para herramientas ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-contracts-tool-manifest==0.1.0",
    "ada-ui-branding==0.1.0",
    "ada-ui-component-global-indicator==0.1.0",
    "ada-ui-core==0.1.0",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-contracts-tool-manifest = { path = "../../contracts/tool-manifest", editable = true }
ada-ui-branding = { workspace = true }
ada-ui-component-global-indicator = { workspace = true }
ada-ui-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.ui.header*"]

[tool.setuptools.package-data]
"ada.ui.header" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]
