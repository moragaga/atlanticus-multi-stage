[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-ui-layout-process"
version = "0.1.0"
description = "Layout semántico Process para ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-contracts-tool-manifest==0.1.0",
    "ada-ui-component-component-container==0.1.0",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-contracts-tool-manifest = { workspace = true }
ada-ui-component-component-container = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.ui.layouts.process*"]

[tool.setuptools.package-data]
"ada.ui.layouts.process" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]
