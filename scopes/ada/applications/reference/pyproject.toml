[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-application-reference"
version = "0.1.2"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-composition-web-application==0.1.0",
    "ada-contracts-tool-manifest==0.1.0",
    "ada-runtime-web==0.1.0",
    "ada-ui-component-branding==0.1.0",
    "ada-ui-component-component-card==0.1.0",
    "ada-ui-component-component-container==0.1.0",
    "ada-ui-component-global-indicator==0.2.0",
    "ada-ui-component-state-wrapper==0.1.0",
    "ada-feature-alarms==0.1.0",
    "ada-feature-dashboard==0.1.0",
    "ada-ui-framework-core==0.1.0",
    "ada-ui-layout-integrated-operations==0.1.0",
    "ada-ui-layout-process==0.1.0",
    "ada-ui-shell-header==0.2.0",
    "ada-ui-shell-navigation==0.1.0",
    "ada-ui-shell-time-status==0.1.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-users-activity==0.1.0",
    "atlanticus-web-users-local==0.1.0",
    "gunicorn==26.0.0",
]

[tool.uv.sources]
ada-composition-web-application = { workspace = true }
ada-runtime-web = { workspace = true }
ada-contracts-tool-manifest = { workspace = true }
ada-ui-component-branding = { workspace = true }
ada-ui-component-component-card = { workspace = true }
ada-ui-component-component-container = { workspace = true }
ada-ui-component-global-indicator = { workspace = true }
ada-ui-component-state-wrapper = { workspace = true }
ada-feature-alarms = { workspace = true }
ada-feature-dashboard = { workspace = true }
ada-ui-framework-core = { workspace = true }
ada-ui-layout-integrated-operations = { workspace = true }
ada-ui-layout-process = { workspace = true }
ada-ui-shell-header = { workspace = true }
ada-ui-shell-navigation = { workspace = true }
ada-ui-shell-time-status = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.applications.reference*"]

[tool.setuptools.package-data]
"ada.applications.reference" = [
    "resources/css/*.css",
    "resources/css/css.list",
]
