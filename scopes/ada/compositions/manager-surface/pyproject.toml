[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-composition-manager-surface"
version = "0.1.1"
description = "Composición reusable del Manager dentro de una aplicación ADA unificada"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-ui-component-branding==0.1.0",
    "ada-ui-shell-header==0.1.0",
    "ada-ui-shell-navigation==0.1.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-manager==0.3.11",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-ui-component-branding = { path = "../../ui/components/branding", editable = true }
ada-ui-shell-header = { path = "../../ui/shell/header", editable = true }
ada-ui-shell-navigation = { path = "../../ui/shell/navigation", editable = true }
atlanticus-web = { path = "../../../../web/framework/core", editable = true }
atlanticus-web-manager = { path = "../../../../web/capabilities/manager", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.compositions.manager_surface*"]

[tool.setuptools.package-data]
"ada.compositions.manager_surface" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
