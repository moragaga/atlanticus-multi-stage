[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-composition-web-deployment"
version = "0.1.9"
description = "Contrato de deployment y lifecycle para aplicaciones web ADA"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-composition-web-bootstrap==0.1.7",
    "atlanticus-web==0.1.0",
    "atlanticus-web-composition-runtime-infrastructure==0.1.1",
]

[tool.uv.sources]
ada-composition-web-bootstrap = { workspace = true }
atlanticus-web = { path = "../../../../web/framework/core", editable = true }
atlanticus-web-composition-runtime-infrastructure = { path = "../../../../web/compositions/runtime-infrastructure", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.compositions.web_deployment*"]

[tool.setuptools.package-data]
"ada.compositions.web_deployment" = ["py.typed"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
