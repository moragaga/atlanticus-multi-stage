[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-composition-process"
version = "0.1.0"
description = "Composición ejecutable base para herramientas Process de ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-contracts-tool-manifest==0.1.0",
    "ada-feature-alarms==0.1.0",
    "ada-feature-dashboard==0.1.0",
    "ada-runtime-web==0.1.0",
    "ada-ui-component-component-card==0.1.0",
    "ada-ui-component-component-container==0.1.0",
    "ada-ui-component-global-indicator==0.1.0",
    "ada-ui-component-state-wrapper==0.1.0",
    "ada-ui-framework-core==0.1.0",
    "ada-ui-layout-process==0.1.0",
    "ada-ui-shell-header==0.1.0",
    "ada-ui-shell-time-status==0.1.0",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-contracts-tool-manifest = { workspace = true }
ada-feature-alarms = { workspace = true }
ada-feature-dashboard = { workspace = true }
ada-runtime-web = { workspace = true }
ada-ui-component-component-card = { workspace = true }
ada-ui-component-component-container = { workspace = true }
ada-ui-component-global-indicator = { workspace = true }
ada-ui-component-state-wrapper = { workspace = true }
ada-ui-framework-core = { workspace = true }
ada-ui-layout-process = { workspace = true }
ada-ui-shell-header = { workspace = true }
ada-ui-shell-time-status = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.compositions.process*"]

[tool.setuptools.package-data]
"ada.compositions.process" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
