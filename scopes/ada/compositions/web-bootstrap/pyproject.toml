[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-composition-web-bootstrap"
version = "0.1.15"
description = "Bootstrap real de dependencias web ADA sobre infraestructura Atlanticus"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-composition-web-application==0.1.0",
    "ada-configuration-tools==0.1.13",
    "atlanticus-cosmos==0.1.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-composition-runtime-infrastructure==0.1.1",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-identity-app-service==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-navigation-configuration==0.1.5",
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-users-activity==0.1.0",
    "atlanticus-web-users-configuration==0.1.6",
    "atlanticus-web-users-cosmos==0.1.6",
    "atlanticus-web-users-local==0.1.0",
]

[tool.uv.sources]
ada-composition-web-application = { workspace = true }
ada-configuration-tools = { workspace = true }
atlanticus-kernel = { path = "../../../../backend/kernel", editable = true }
atlanticus-observability = { path = "../../../../backend/observability", editable = true }
atlanticus-cosmos = { path = "../../../../connectivity/cosmos", editable = true }
atlanticus-http = { path = "../../../../connectivity/http-client", editable = true }
atlanticus-web = { path = "../../../../web/framework/core", editable = true }
atlanticus-web-composition-runtime-infrastructure = { path = "../../../../web/compositions/runtime-infrastructure", editable = true }
atlanticus-web-composition-sharepoint-http = { path = "../../../../web/compositions/sharepoint-http", editable = true }
atlanticus-web-identity = { path = "../../../../web/capabilities/identity/core", editable = true }
atlanticus-web-identity-app-service = { path = "../../../../web/capabilities/identity/app-service", editable = true }
atlanticus-web-identity-local = { path = "../../../../web/capabilities/identity/local", editable = true }
atlanticus-web-navigation = { path = "../../../../web/capabilities/navigation/core", editable = true }
atlanticus-web-navigation-configuration = { path = "../../../../web/capabilities/navigation/configuration", editable = true }
atlanticus-web-users = { path = "../../../../web/capabilities/users/core", editable = true }
atlanticus-web-users-activity = { path = "../../../../web/capabilities/users/activity", editable = true }
atlanticus-web-users-configuration = { path = "../../../../web/capabilities/users/configuration", editable = true }
atlanticus-web-users-cosmos = { path = "../../../../web/capabilities/users/cosmos", editable = true }
atlanticus-web-users-local = { path = "../../../../web/capabilities/users/local", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.compositions.web_bootstrap*"]

[tool.setuptools.package-data]
"ada.compositions.web_bootstrap" = ["py.typed"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
