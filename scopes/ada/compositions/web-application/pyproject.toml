[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-composition-web-application"
version = "0.1.0"
description = "Composición transversal base para aplicaciones web ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-composition-navigation-activity==0.1.0",
    "atlanticus-web-composition-users-navigation==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-users-activity==0.1.0",
]

[tool.uv.sources]
atlanticus-web = { path = "../../../../web/framework/core", editable = true }
atlanticus-web-composition-navigation-activity = { path = "../../../../web/compositions/navigation-activity", editable = true }
atlanticus-web-composition-users-navigation = { path = "../../../../web/compositions/users-navigation", editable = true }
atlanticus-web-identity = { path = "../../../../web/capabilities/identity/core", editable = true }
atlanticus-web-navigation = { path = "../../../../web/capabilities/navigation/core", editable = true }
atlanticus-web-users = { path = "../../../../web/capabilities/users/core", editable = true }
atlanticus-web-users-activity = { path = "../../../../web/capabilities/users/activity", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.compositions.web_application*"]

[tool.setuptools.package-data]
"ada.compositions.web_application" = ["py.typed"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
